    <script>
      // Pick the theme before the first paint so there is no flash (the app re-applies it from src/theme.js).
      (function () {
        var pref = 'system';
        try { pref = (JSON.parse(localStorage.getItem('wine-atlas-settings-v1')) || {}).theme || 'system'; } catch (e) {}
        var light = pref === 'light' || (pref !== 'dark' && window.matchMedia('(prefers-color-scheme: light)').matches);
        document.documentElement.dataset.theme = light ? 'light' : 'dark';
      })();
    </script>
